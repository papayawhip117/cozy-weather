<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Cozy Weather</title>
  </head>

  <body>
    <main class="weather-card">
      <div class="plant">🪴</div>

      <p class="greeting">good morning! ♡</p>

      <h1 class="location"></h1>

      <div class="weather">
        <span class="weather-icon">☁️</span>
        <span class="temperature">58°</span>
      </div>

      <p class="condition">partly cloudy</p>

      <div class="details">
        <span class="high">☀️ high 63°</span>
        <span class="low">🌙 low 47°</span>
      </div>
    </main>

    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
